name: MatchCV SQL Server Integration

on:
  push:
    branches:
      - developer
  pull_request:
    branches:
      - developer
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matchcv-sql-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-server-integration:
    name: SQL Server - migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      APP_ENVIRONMENT: test
      TEST_DATABASE_PASSWORD: ${{ secrets.MATCHCV_TEST_DATABASE_PASSWORD || 'MatchCV_Test_CI_2026!Safe' }}
      MATCHCV_TEST_DATABASE_PASSWORD: ${{ secrets.MATCHCV_TEST_DATABASE_PASSWORD || 'MatchCV_Test_CI_2026!Safe' }}
      MATCHCV_TEST_DATABASE_HOST: 127.0.0.1
      MATCHCV_TEST_DATABASE_PORT: '1435'
      MATCHCV_TEST_DATABASE_NAME: MatchCVTest
      MATCHCV_TEST_DATABASE_USER: sa
      # Integration tests must not need live AI credentials.
      ANALYSIS_QUEUE_ENCRYPTION_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install SQL Server ODBC driver and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg2 unixodbc-dev
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Start isolated SQL Server test instance
        run: docker compose --env-file /dev/null -f docker-compose.test.yml up -d
      - name: Apply test migrations and validate schema
        run: python scripts/ci_apply_test_migrations.py

      - name: Run SQL Server integration suite
        run: python -m pytest MatchCV.Tests/Integration -q
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Stop and remove isolated SQL Server
        if: always()
        run: docker compose --env-file /dev/null -f docker-compose.test.yml down --volumes --remove-orphans
