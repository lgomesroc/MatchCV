name: MatchCV CI

on:
  push:
    branches:
      - developer
      - main
  pull_request:
    branches:
      - developer
      - main

permissions:
  contents: read

concurrency:
  group: matchcv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run backend unit tests
        run: python -m pytest MatchCV.Tests/Unit -q

      - name: Run resume parser integration tests
        run: python -m pytest MatchCV.Tests/Integration/Parser -q

  frontend:
    name: Frontend - Angular and Playwright
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MatchCV.Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: MatchCV.Frontend/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.19.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test
        env:
          CI: "true"

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"
