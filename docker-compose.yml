services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: matchcv-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DATABASE_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - matchcv_sqlserver_data:/var/opt/mssql

volumes:
  matchcv_sqlserver_data:
