<main class="password-page">
  <section class="password-card" aria-labelledby="password-title">
    <a class="back-link" routerLink="/analysis">Voltar à análise</a>

    <p class="eyebrow">MATCHCV — SEGURANÇA</p>
    <h1 id="password-title">Alterar senha</h1>
    <p class="intro">
      Confirme sua senha atual e escolha uma nova senha para sua conta.
    </p>

    <div *ngIf="errorMessage" class="message error" role="alert">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="message success" role="status">
      {{ successMessage }}
      <button
        type="button"
        class="primary-button"
        (click)="goToAnalysis()"
      >
        Voltar à análise
      </button>
    </div>

    <form
      *ngIf="!successMessage"
      (ngSubmit)="submit()"
      #passwordForm="ngForm"
    >
      <label for="current-password">Senha atual</label>
      <input
        id="current-password"
        name="currentPassword"
        type="password"
        [(ngModel)]="currentPassword"
        autocomplete="current-password"
        required
      />

      <label for="new-password">Nova senha</label>
      <input
        id="new-password"
        name="newPassword"
        type="password"
        [(ngModel)]="newPassword"
        autocomplete="new-password"
        required
        minlength="8"
      />

      <p class="hint">
        Mínimo de 8 caracteres, incluindo maiúscula, minúscula, número e
        caractere especial.
      </p>

      <label for="confirm-password">Confirme a nova senha</label>
      <input
        id="confirm-password"
        name="confirmPassword"
        type="password"
        [(ngModel)]="confirmPassword"
        autocomplete="new-password"
        required
        minlength="8"
      />

      <button
        class="primary-button"
        type="submit"
        [disabled]="isSubmitting || passwordForm.invalid"
      >
        {{ isSubmitting ? 'Alterando...' : 'Alterar senha' }}
      </button>
    </form>
  </section>
</main>
